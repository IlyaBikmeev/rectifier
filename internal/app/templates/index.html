<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Rectifier</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container py-4">
      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="mb-1">Rectifier</h1>
          <div class="text-secondary">Мониторинг ректификационной колонны</div>
        </div>

        <div class="text-end">
          <div class="text-secondary small mb-1">Состояние процесса</div>

          <span class="badge text-bg-secondary fs-6"> ОСТАНОВЛЕН </span>
        </div>
      </div>

      <!-- Process -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="row align-items-center g-3">
            <div class="col">
              <div class="text-secondary small">Текущий процесс</div>

              <div class="fs-5 fw-semibold">Остановлен</div>

              <!--
                    Когда процесс будет запущен:

                    <div class="fs-5 fw-semibold">
                        Запущен · 01:42:17
                    </div>
                    -->
            </div>

            <div class="col-auto">
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-success">Старт</button>

                <button type="button" class="btn btn-danger">Стоп</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Sensors header -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">Датчики</h2>

        <span class="text-secondary"> {{len .Sensors}} подключено </span>
      </div>

      <!-- Sensors -->
      <div class="row g-3">
        {{range .Sensors}}
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <h5 class="card-title mb-1">{{.Name}}</h5>

                  <div class="text-secondary small">{{.ID}}</div>
                </div>
              </div>

              <div class="mt-4">
                <span class="display-5 fw-semibold">
                  {{printf "%.1f" .Temperature}}
                </span>

                <span class="fs-4 text-secondary"> °C </span>
              </div>
            </div>
          </div>
        </div>
        {{end}}
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
