<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Rectifier</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container py-4">
      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="mb-1">Rectifier</h1>
          <div class="text-secondary">Мониторинг ректификационной колонны</div>
        </div>

        <div class="text-end">
          <div class="text-secondary small mb-1">Состояние процесса</div>

          <span class="badge text-bg-secondary fs-6"> ОСТАНОВЛЕН </span>
        </div>
      </div>

      <!-- Process -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="row align-items-center g-3">
            <div class="col">
              <div class="text-secondary small">Текущий процесс</div>

              <div class="fs-5 fw-semibold">Остановлен</div>

              <!--
                    Когда процесс будет запущен:

                    <div class="fs-5 fw-semibold">
                        Запущен · 01:42:17
                    </div>
                    -->
            </div>

            <div class="col-auto">
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-success">Старт</button>

                <button type="button" class="btn btn-danger">Стоп</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Sensors header -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">Датчики</h2>

        <span id="sensor-count" class="text-secondary">
          {{len .Sensors}} подключено
        </span>
      </div>

      <div id="status-error" class="alert alert-warning d-none" role="alert">
        Не удалось обновить состояние датчиков. Показаны последние полученные
        данные.
      </div>

      <!-- Sensors -->
      <div id="sensor-list" class="row g-3" aria-live="polite">
        {{range .Sensors}}
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <h5 class="card-title mb-1">{{.Name}}</h5>

                  <div class="text-secondary small">{{.ID}}</div>
                </div>
              </div>

              <div class="mt-4">
                <span class="display-5 fw-semibold">
                  {{printf "%.1f" .Temperature}}
                </span>

                <span class="fs-4 text-secondary"> °C </span>
              </div>
            </div>
          </div>
        </div>
        {{end}}
      </div>

      <template id="sensor-card-template">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <div
                class="d-flex justify-content-between align-items-start gap-3"
              >
                <div>
                  <h5 class="card-title mb-1" data-field="name"></h5>
                  <div class="text-secondary small" data-field="id"></div>
                </div>

                <span class="badge" data-field="status"></span>
              </div>

              <div class="mt-4">
                <span
                  class="display-5 fw-semibold"
                  data-field="temperature"
                ></span>
                <span class="fs-4 text-secondary"> °C </span>
              </div>

              <div
                class="text-secondary small mt-2"
                data-field="last-successful-read"
              ></div>
            </div>
          </div>
        </div>
      </template>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const statusPollingInterval = 5000;
      const lastReadFormatter = new Intl.DateTimeFormat("ru-RU", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });

      function hasSuccessfulRead(sensor) {
        return (
          sensor.last_successful_read &&
          !sensor.last_successful_read.startsWith("0001-")
        );
      }

      function renderSensors(sensors) {
        const sensorList = document.getElementById("sensor-list");
        const sensorCount = document.getElementById("sensor-count");
        const sensorCardTemplate = document.getElementById(
          "sensor-card-template",
        );
        const cards = document.createDocumentFragment();

        for (const sensor of sensors) {
          const card =
            sensorCardTemplate.content.firstElementChild.cloneNode(true);
          const successfulRead = hasSuccessfulRead(sensor);
          const status = card.querySelector('[data-field="status"]');

          card.querySelector('[data-field="name"]').textContent = sensor.name;
          card.querySelector('[data-field="id"]').textContent = sensor.id;
          card.querySelector('[data-field="temperature"]').textContent =
            successfulRead && Number.isFinite(sensor.temperature)
              ? sensor.temperature.toFixed(1)
              : "—";

          status.textContent = sensor.status === "OK" ? "В сети" : "Ошибка";
          status.classList.add(
            sensor.status === "OK" ? "text-bg-success" : "text-bg-danger",
          );

          card.querySelector(
            '[data-field="last-successful-read"]',
          ).textContent = successfulRead
            ? `Последнее чтение: ${lastReadFormatter.format(
                new Date(sensor.last_successful_read),
              )}`
            : "Нет успешных измерений";

          cards.append(card);
        }

        sensorList.replaceChildren(cards);
        sensorCount.textContent = `${sensors.length} подключено`;
      }

      async function loadStatus() {
        try {
          const response = await fetch("/api/status", {
            cache: "no-store",
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const sensors = await response.json();

          if (!Array.isArray(sensors)) {
            throw new Error("Unexpected status response format");
          }

          renderSensors(sensors);
          document.getElementById("status-error").classList.add("d-none");
        } catch (error) {
          console.error("Failed to load status:", error);
          document.getElementById("status-error").classList.remove("d-none");
        }
      }

      loadStatus();
      setInterval(loadStatus, statusPollingInterval);
    </script>
  </body>
</html>
